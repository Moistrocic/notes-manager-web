name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # we-scene is a git submodule, so the checkout has to bring it along or
      # the scene wallpaper code has nothing to import.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Guards against over-broad .gitignore patterns silently dropping source
      # files from the repository.
      - name: Repository file check
        run: npm run check:repo

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Renders the component tree in Node (splash, login, workspace, dialogs),
      # drives the store to assert when a save is issued, checks the outline
      # against the renderer, and clicks through the navigation in jsdom.
      - name: Web checks
        run: npm run check:web

      # Unit tests for the server helpers (base path resolution, ...).
      - name: Server tests
        run: npm run test:server

      # Extracts the installer's own functions and configuration section from
      # install.sh and runs them: KEY=VALUE parsing, the application copy and
      # the runtime .env assembly (74 assertions).
      - name: Installer tests
        run: npm run test:installer

      # Pinned so CI runs exactly the version the scripts were verified with
      # (the distro package lags several releases behind).
      #
      # The download is retried, and the archive is tested before it is
      # unpacked. A single CDN hiccup used to fail this step in under a second
      # and turn an unrelated commit red, which says nothing about the scripts
      # it is meant to be checking.
      - name: ShellCheck installer scripts
        run: |
          set -euo pipefail
          url=https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
                -o /tmp/shellcheck.tar.xz "$url"; then
              echo "downloaded on attempt $attempt"
              break
            fi
            echo "download attempt $attempt failed"
            sleep $((attempt * 3))
          done
          # -t reports a truncated download as exactly that, instead of letting
          # tar fail with something that reads like a scripting error.
          xz -t /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck --version
          /tmp/shellcheck-v0.11.0/shellcheck --severity=warning \
            scripts/install.sh scripts/uninstall.sh scripts/test-install.sh scripts/doctor.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Guards against over-broad .gitignore patterns silently dropping source
      # files from the repository.
      - name: Repository file check
        run: npm run check:repo

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Renders the whole component tree in Node (splash, login, workspace,
      # dialogs) so a broken UI fails the build instead of the user.
      - name: Render check
        run: npm run check:render

      # Extracts copy_application()/verify_tree() from install.sh and runs them
      # against a synthetic tree, covering the installer file-copy regression.
      - name: Installer copy test
        run: npm run test:installer

      - name: Shellcheck installer scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/install.sh scripts/uninstall.sh scripts/test-install-copy.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Guards against over-broad .gitignore patterns silently dropping source
      # files from the repository.
      - name: Repository file check
        run: npm run check:repo

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Renders the whole component tree in Node (splash, login, workspace,
      # dialogs) so a broken UI fails the build instead of the user.
      - name: Render check
        run: npm run check:render

      # Extracts the installer's own functions and configuration section from
      # install.sh and runs them: KEY=VALUE parsing, the application copy and
      # the runtime .env assembly (48 assertions).
      - name: Installer tests
        run: npm run test:installer

      # Pinned so CI runs exactly the version the scripts were verified with
      # (the distro package lags several releases behind).
      - name: ShellCheck installer scripts
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck --version
          /tmp/shellcheck-v0.11.0/shellcheck --severity=warning \
            scripts/install.sh scripts/uninstall.sh scripts/test-install.sh scripts/doctor.sh
